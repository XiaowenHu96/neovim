name: test
on:
  push:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
  pull_request:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unique per run: allow several dispatched runs of this debug workflow in parallel.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1:log_path=${{ github.workspace }}/build/log/asan:intercept_tls_get_addr=0
  BIN_DIR: ${{ github.workspace }}/bin
  BUILD_DIR: ${{ github.workspace }}/build
  INSTALL_PREFIX: ${{ github.workspace }}/nvim-install
  LOG_DIR: ${{ github.workspace }}/build/log
  NVIM_LOG_FILE: ${{ github.workspace }}/build/nvim.log
  NVIM_PROVIDER_STDERR: ${{ github.workspace }}/build/log/provider.stderr
  TSAN_OPTIONS: log_path=${{ github.workspace }}/build/log/tsan
  VALGRIND_LOG: ${{ github.workspace }}/build/log/valgrind-%p.log

# DEBUG WORKFLOW for https://github.com/neovim/neovim/pull/40520
# Trimmed to the 3 ubuntu oldtest jobs that fail on the PR. Runs test_perl in
# a loop and dumps the perl provider host's stderr (captured via
# $NVIM_PROVIDER_STDERR, see runtime/autoload/provider.vim) to find out why
# the host dies ("ch 3 was closed by the peer" in Test_set_cursor).
jobs:
  posix:
    name: ${{ matrix.build.os }} ${{ matrix.build.flavor }} ${{ matrix.build.cc }} ${{ matrix.test }} (copy ${{ matrix.copy }})
    strategy:
      fail-fast: false
      matrix:
        build:
          [
            { runner: ubuntu-24.04, os: ubuntu, flavor: asan, cc: clang, flags: -D ENABLE_ASAN_UBSAN=ON },
            { runner: ubuntu-24.04, os: ubuntu, flavor: release, cc: gcc, flags: -D CMAKE_BUILD_TYPE=Release -D ENABLE_TRANSLATIONS=ON },
            { runner: ubuntu-24.04, os: ubuntu, flavor: puc-lua, cc: gcc, deps_flags: -D USE_BUNDLED_LUAJIT=OFF -D USE_BUNDLED_LUA=ON, flags: -D PREFER_LUA=ON },
          ]
        test: [oldtest]
        copy: [1, 2, 3]
    runs-on: ${{ matrix.build.runner }}
    timeout-minutes: 60
    env:
      CC: ${{ matrix.build.cc }}
      NVIM_TEST_INTEG: ${{ matrix.build.flavor == 'release' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          install_flags: "--test"

      - name: Create log dir
        run: mkdir -p "$LOG_DIR"

      - name: Set up interpreter packages
        run: |
          echo "Install neovim RubyGem."
          gem install --no-document --bindir "$BIN_DIR" --user-install --pre neovim

          sudo cpanm -n Neovim::Ext || cat "$HOME/.cpanm/build.log"
          perl -W -e 'use Neovim::Ext; print $Neovim::Ext::VERSION'

      - name: Remove .git directory
        run: cmake -E rm -rf -- .git

      - name: Build third-party deps
        env:
          BUILD_DEPS_FLAGS: ${{ matrix.build.deps_flags }}
        run: |
          cmake -S cmake.deps --preset ci -D CMAKE_BUILD_TYPE=Debug $BUILD_DEPS_FLAGS
          cmake --build .deps

      - name: Build
        env:
          BUILD_FLAGS: ${{ matrix.build.flags }}
        run: |
          cmake --preset ci -D CMAKE_BUILD_TYPE=Debug -D CMAKE_INSTALL_PREFIX:PATH=$INSTALL_PREFIX $BUILD_FLAGS
          cmake --build build

      - name: full oldtest suite (faithful reproduction context)
        timeout-minutes: 25
        run: |
          fail=0
          make -C test/old/testdir NVIM_PRG=$(realpath build)/bin/nvim || fail=1
          if test -s "$NVIM_PROVIDER_STDERR"; then
            echo "--- provider host stderr captured during full suite ---"
            cat "$NVIM_PROVIDER_STDERR"
            rm -f "$NVIM_PROVIDER_STDERR"
          fi
          exit $fail

      - if: '!cancelled()'
        name: oldtest test_perl loop
        timeout-minutes: 20
        run: |
          fail=0
          for i in $(seq 1 100); do
            echo "::group::iteration $i"
            rm -f test/old/testdir/test_perl.res test/old/testdir/messages test/old/testdir/test.log
            make -C test/old/testdir NVIM_PRG=$(realpath build)/bin/nvim test_perl.res || true
            if test -f test/old/testdir/test.log; then
              fail=1
              echo "--- FAILURE on iteration $i: messages ---"
              cat test/old/testdir/messages || true
            fi
            if test -s "$NVIM_PROVIDER_STDERR"; then
              echo "--- provider host stderr, iteration $i ---"
              cat "$NVIM_PROVIDER_STDERR"
              rm -f "$NVIM_PROVIDER_STDERR"
            fi
            echo "::endgroup::"
          done
          echo "overall: $([ $fail -eq 0 ] && echo ALL PASSED || echo SOME ITERATIONS FAILED)"
          exit $fail

      - if: '!cancelled()'
        name: Show logs
        run: find "$LOG_DIR" -type f -exec echo "=== {} ===" \; -exec cat {} \;
